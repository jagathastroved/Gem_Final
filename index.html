  <script>
    function getQueryStringValue(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function setCookieReferralLevel(cvalue) {
      if (!cvalue || cvalue.trim() === "") {
        return;
      }

      var d = new Date();
      d.setTime(d.getTime() + (7 * 24 * 60 * 60 * 1000));
      var expires = "expires=" + d.toUTCString();
      document.cookie = "referralLevel1=" + cvalue + ";" + expires + ";path=/";
    }
    function ReadCookie(cookieName) {
      var theCookie = " " + document.cookie;
      var ind = theCookie.indexOf(" " + cookieName + "=");
      if (ind == -1) ind = theCookie.indexOf(";" + cookieName + "=");
      if (ind == -1 || cookieName == "") return "";
      var ind1 = theCookie.indexOf(";", ind + 1);
      if (ind1 == -1) ind1 = theCookie.length;
      return unescape(theCookie.substring(ind + cookieName.length + 2, ind1));
    }

    function CheckForDomain(refURL) {
      if (refURL != "") {
        var a = document.createElement('a');
        a.href = refURL;
        var hostname = a.hostname;
        if (hostname != window.location.hostname) { return hostname; } else { return ""; }
      }
      return refURL;
    }

    //To set referralLevel1 cookie
    var referralLevel1cookie = ReadCookie("referralLevel1");
    if (referralLevel1cookie == null || referralLevel1cookie == "") {
      var refURL = document.referrer;
      var referralURL = CheckForDomain(refURL);
      var promoCode = getQueryStringValue("promo");
      //(promoCode != null) ? setCookieReferralLevel(promoCode) : (referralURL != "") ? setCookieReferralLevel(referralURL) : "";
      if (promoCode) {
        setCookieReferralLevel(promoCode);
      } else if (referralURL) {
        setCookieReferralLevel(referralURL);
      }
    }
  </script>
